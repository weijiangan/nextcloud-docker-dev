server_tokens off;
client_max_body_size 1024m;

proxy_read_timeout 3600;
proxy_send_timeout 3600;
proxy_connect_timeout 3600;

proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port $server_port;

# Rust nc-server (default entry).
server {
    listen 80 default_server;

    location / {
        proxy_pass http://nextcloud:80;
    }
}

# ── Dev-only PHP entry ──────────────────────────────────────────────────────
# Fronts the nextcloud container's php-fpm directly (TCP pool [tcp] on :9000),
# bypassing the Rust nc-server, so PHP and Rust can be compared on the SAME
# database/apps/config. Reach it with `Host: php.dev.local`; anything else hits
# the Rust default_server above. Adapted from the official Nextcloud nginx
# config (admin_manual/installation/nginx.html).
upstream php-handler {
    server nextcloud:9000;
}

server {
    listen 80;
    # Dedicated port so PHP is reachable over the LAN exactly like the Rust
    # default_server (e.g. http://<lan-ip>:8081), for iOS A/B testing.  On this
    # port the block is the only server, so it is the default and accepts any
    # Host header; on :80 it still matches only php.dev.local.
    listen 9090;
    server_name php.dev.local;

    server_tokens off;
    client_max_body_size 1024m;
    fastcgi_buffers 64 4K;

    # Path valid inside the nextcloud container (where php-fpm resolves it).
    root /var/www/html;
    index index.php;

    # Static assets (CSS/JS/images/fonts) live in the nextcloud container, not
    # this proxy.  Proxy them to the Rust server, which serves the same
    # /var/www/html tree, so the web login flow renders and functions.  This is
    # cosmetic-only: every API/DAV request still goes to pure PHP-FPM below.
    location ~* \.(?:css|js|mjs|svg|gif|ico|jpg|jpeg|png|webp|woff2?|ttf|otf|eot|map|wasm)$ {
        proxy_pass http://nextcloud:80;
        proxy_set_header Host $http_host;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php$request_uri;
    }

    # Pass PHP requests to PHP-FPM. NOTE: the official config's
    # `try_files $fastcgi_script_name =404` is intentionally dropped — the
    # script files live in the nextcloud container, not this proxy, so nginx
    # cannot stat them here. This vhost is dev-only.
    location ~ \.php(?:$|/) {
        # Rewrite everything except Nextcloud's real entry points to the front
        # controller (mirrors the .htaccess / official-config exceptions).
        rewrite ^/(?!index|remote|public|cron|status|ocs/v[12]|ocs-provider/.+|core/ajax/update|updater/.+) /index.php$request_uri;

        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;

        include fastcgi_params;
        fastcgi_pass php-handler;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_param PATH_INFO       $path_info;
        fastcgi_param HTTPS           off;
        fastcgi_param modHeadersAvailable true;
        fastcgi_param front_controller_active true;
        fastcgi_request_buffering on;
        fastcgi_read_timeout 300s;
    }
}
