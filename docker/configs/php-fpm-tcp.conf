; TCP FastCGI pool so the dev nginx proxy can reach PHP directly, bypassing the
; Rust nc-server (which uses the unix-socket pool [www]).
;
; Named zzzz-* so it loads AFTER zzz-nextcloud.conf — that file carries no
; [pool] header, so its `listen = /run/php/php-fpm.sock` applies to the last
; opened pool. Loading this last guarantees [tcp] keeps `listen = 9000` and the
; [www] pool stays on the socket for the Rust server.
[tcp]
user = www-data
group = www-data
listen = 9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
