; Nextcloud custom FPM pool configuration
; Only overrides the listen socket settings from the default www.conf
; This file is named zzz-nextcloud.conf to load after www.conf (glob order)

; Listen on a Unix socket instead of TCP
listen = /run/php/php-fpm.sock

; Socket permissions for nginx communication
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
